<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcações — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #f6f4f2; --surface: #ffffff; --surface-2: #eeecf5;
    --ink: #211f2b; --ink-soft: #4d495c; --muted: #8b869c; --border: #e0dcec;
    --accent: #6a4fd6; --accent-soft: #ece7fb;
    --good: #2f7a56; --good-soft: #e3f3ea;
    --danger: #b23b3b; --danger-soft: #f8e4e1;
    --shadow: 0 1px 2px rgba(33,31,43,0.05), 0 8px 24px -10px rgba(33,31,43,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #18171f; --surface: #211f2b; --surface-2: #2a2836;
      --ink: #eeeaf7; --ink-soft: #c8c2dd; --muted: #948da8; --border: #3a3648;
      --accent: #a690ff; --accent-soft: #2a2440;
      --good: #6fcf9d; --good-soft: #1c332a;
      --danger: #e08080; --danger-soft: #3a2020;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -10px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #18171f; --surface: #211f2b; --surface-2: #2a2836;
    --ink: #eeeaf7; --ink-soft: #c8c2dd; --muted: #948da8; --border: #3a3648;
    --accent: #a690ff; --accent-soft: #2a2440;
    --good: #6fcf9d; --good-soft: #1c332a;
    --danger: #e08080; --danger-soft: #3a2020;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -10px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Work Sans", system-ui, sans-serif; padding: 24px 16px 60px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  header.top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  header.top h1 { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 1.5rem; margin: 0; }
  button.linklike {
    background: none; border: none; color: var(--muted); font-size: 0.82rem; cursor: pointer;
    font-family: inherit; text-decoration: underline;
  }

  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button {
    font-family: "Manrope", sans-serif; font-weight: 600; font-size: 0.82rem;
    background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 13px; cursor: pointer;
  }
  .tabs button.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  section.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  section.card h2 { font-family: "Manrope", sans-serif; font-weight: 700; font-size: 1.05rem; margin: 0 0 12px; }
  section.card h3 { font-family: "Manrope", sans-serif; font-weight: 700; font-size: 0.92rem; margin: 18px 0 10px; }
  label.field { display: block; margin-bottom: 12px; }
  label.field span { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  input[type=email], input[type=password], input[type=text] {
    width: 100%; font-family: inherit; font-size: 0.95rem; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; background: var(--bg); color: var(--ink);
  }
  input[type=number] {
    width: 90px; font-family: inherit; font-size: 0.9rem; border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--ink);
  }
  input[type=color] {
    width: 38px; height: 38px; padding: 2px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); cursor: pointer;
  }
  input[type=time] {
    font-family: "IBM Plex Mono", monospace; font-size: 0.85rem; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px; background: var(--bg); color: var(--ink);
  }
  input:focus, button:focus-visible, details summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  button.primary {
    font-family: "Manrope", sans-serif; font-weight: 700; font-size: 0.92rem;
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 11px 18px; cursor: pointer;
  }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.small {
    font-family: "Work Sans", sans-serif; font-size: 0.78rem; padding: 6px 11px;
    border-radius: 7px; border: 1px solid var(--border); background: var(--surface);
    color: var(--ink); cursor: pointer; flex-shrink: 0;
  }
  button.small:hover { border-color: var(--accent); }
  button.small.danger { color: var(--danger); }
  button.small.danger:hover { border-color: var(--danger); }

  .err-box { background: var(--danger-soft); color: var(--danger); border-radius: 8px; padding: 10px 12px; font-size: 0.85rem; margin-bottom: 12px; }
  .ok-box { background: var(--good-soft); color: var(--good); border-radius: 8px; padding: 10px 12px; font-size: 0.85rem; margin-bottom: 12px; }
  .empty, .muted-note { color: var(--muted); font-size: 0.88rem; }

  .day-group { margin-bottom: 16px; }
  .day-group:last-child { margin-bottom: 0; }
  .day-label {
    font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px;
  }
  .booking {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 0; border-top: 1px solid var(--border);
  }
  .day-group .booking:first-of-type { border-top: none; }
  .booking .time { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 0.95rem; min-width: 52px; }
  .booking .info { flex: 1; min-width: 0; }
  .booking .info .name { font-weight: 600; font-size: 0.92rem; }
  .booking .info .sub { color: var(--muted); font-size: 0.78rem; }
  .booking .phone { font-family: "IBM Plex Mono", monospace; font-size: 0.82rem; color: var(--ink-soft); }

  .item-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 12px 0; border-top: 1px solid var(--border);
  }
  .item-row:first-of-type { border-top: none; }
  .item-row .grow { flex: 1; min-width: 140px; }
  .item-row .chk { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); }

  details.emp-detail { margin-top: 10px; }
  details.emp-detail summary { cursor: pointer; font-size: 0.8rem; color: var(--accent); }
  details.emp-detail .inner { padding: 12px 0 4px; }

  .svc-chk-list { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 4px; }
  .svc-chk-list label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }

  .hours-grid { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
  .hours-grid .hrow { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; flex-wrap: wrap; }
  .hours-grid .hrow .wd { width: 92px; flex-shrink: 0; color: var(--muted); font-size: 0.8rem; }
  .hours-grid .hrow .chk { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; color: var(--muted); }

  .add-box { border-top: 1px dashed var(--border); margin-top: 14px; padding-top: 14px; }

  details.settings { margin-bottom: 16px; }
  details.settings summary { cursor: pointer; font-size: 0.82rem; color: var(--muted); text-decoration: underline; margin-bottom: 10px; }

  .skel {
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%);
    background-size: 200% 100%; border-radius: 6px; height: 14px; margin: 6px 0;
    animation: shimmer 1.4s ease infinite;
  }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="titleEl">Marcações</h1>
    <div>
      <button class="linklike" id="switchSalonBtn" style="display:none">trocar salão</button>
      <button class="linklike" id="logoutBtn" style="display:none">sair</button>
    </div>
  </header>
  <div id="tabsNav" class="tabs" style="display:none"></div>
  <div id="app">
    <section class="card"><div class="skel" style="width:40%"></div></section>
  </div>
</div>

<script>
(function () {
  "use strict";
  var SUPABASE_URL = "https://tpfyxhpdbmwvpcbddlsw.supabase.co";
  var SUPABASE_KEY = "sb_publishable_vuCCk8kUlvOcpmFLeO8OWw_etBSvgN9";
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var appData = { salon: null, services: [], employees: [], empServices: [], empHours: [] };
  var activeTab = "bookings";
  var currentSalon = null;
  var mySalonsList = [];
  var WEEKDAYS = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
  var WEEKDAYS_SHORT = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function renderApp(html) { document.getElementById("app").innerHTML = html; }
  function errBox(msg) { return '<div class="err-box">' + escapeHtml(msg) + "</div>"; }
  function fmtDatePt(dateStr) { var p = dateStr.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
  function isFkError(err) { return err && (err.code === "23503"); }
  function copyText(text, btn) {
    var orig = btn.textContent;
    function done() { btn.textContent = "copiado!"; setTimeout(function () { btn.textContent = orig; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  // ---------- Login ----------
  function renderLogin(message) {
    document.getElementById("logoutBtn").style.display = "none";
    document.getElementById("switchSalonBtn").style.display = "none";
    document.getElementById("tabsNav").style.display = "none";
    renderApp(
      '<section class="card"><h2>Entrar</h2>' +
        (message ? '<div class="ok-box">' + escapeHtml(message) + "</div>" : "") +
        '<div id="loginErr"></div>' +
        '<label class="field"><span>Email</span><input type="email" id="loginEmail" autocomplete="email"></label>' +
        '<label class="field"><span>Password</span><input type="password" id="loginPw" autocomplete="current-password"></label>' +
        '<button class="primary" id="loginBtn">Entrar</button>' +
      "</section>"
    );
    document.getElementById("loginPw").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
    document.getElementById("loginBtn").addEventListener("click", doLogin);
    function doLogin() {
      var email = document.getElementById("loginEmail").value.trim();
      var password = document.getElementById("loginPw").value;
      var errDiv = document.getElementById("loginErr");
      errDiv.innerHTML = "";
      if (!/^\S+@\S+\.\S+$/.test(email)) { errDiv.innerHTML = errBox("Indica um email válido."); return; }
      if (!password) { errDiv.innerHTML = errBox("Indica a password."); return; }
      var btn = document.getElementById("loginBtn");
      btn.disabled = true; btn.textContent = "A entrar…";
      sb.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
        btn.disabled = false; btn.textContent = "Entrar";
        if (res.error) { errDiv.innerHTML = errBox("Email ou password incorretos."); return; }
        boot();
      });
    }
  }

  // ---------- Salon selection / creation ----------
  function selectSalon(s) {
    currentSalon = s;
    try { localStorage.setItem("lastSalonId", s.salon_id); } catch (e) {}
    document.getElementById("titleEl").textContent = s.name || "Marcações";
    document.getElementById("switchSalonBtn").style.display = mySalonsList.length > 1 ? "inline" : "none";
    renderTabsNav();
    reloadDataAndRender();
  }

  function renderSalonPicker() {
    document.getElementById("logoutBtn").style.display = "inline";
    document.getElementById("switchSalonBtn").style.display = "none";
    document.getElementById("tabsNav").style.display = "none";
    var items = mySalonsList.map(function (s) {
      return (
        '<button class="opt-salon" data-id="' + s.salon_id + '" style="display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;' +
        'border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;font-family:inherit;font-size:0.95rem;color:inherit">' +
          escapeHtml(s.name) +
        "</button>"
      );
    }).join("");
    renderApp(
      '<section class="card"><h2>Escolhe o salão</h2>' + items +
        '<button class="small" id="newSalonBtn" style="margin-top:6px">+ criar novo salão</button>' +
      "</section>"
    );
    document.querySelectorAll(".opt-salon").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var s = mySalonsList.find(function (x) { return x.salon_id === btn.getAttribute("data-id"); });
        selectSalon(s);
      });
    });
    document.getElementById("newSalonBtn").addEventListener("click", function () { renderCreateSalon(); });
  }

  function renderCreateSalon() {
    document.getElementById("logoutBtn").style.display = "inline";
    document.getElementById("switchSalonBtn").style.display = "none";
    document.getElementById("tabsNav").style.display = "none";
    var hasOthers = mySalonsList.length > 0;
    renderApp(
      '<section class="card"><h2>' + (hasOthers ? "Criar novo salão" : "Cria o teu salão") + "</h2>" +
        (hasOthers ? '<button class="linklike" id="backToPicker" style="display:block;margin-bottom:12px">← voltar aos salões</button>' : "") +
        '<div id="createErr"></div>' +
        '<label class="field"><span>Nome do salão</span><input type="text" id="newSalonName" placeholder="Ex: Salão Bela Vista"></label>' +
        '<label class="field"><span>Link público (slug)</span><input type="text" id="newSalonSlug" placeholder="ex-bela-vista"></label>' +
        '<p class="muted-note">Os clientes vão usar este link para marcar online. Podes mudar o nome depois; o link é gerado a partir do nome.</p>' +
        '<button class="primary" id="createSalonBtn">Criar salão</button>' +
      "</section>"
    );
    if (hasOthers) document.getElementById("backToPicker").addEventListener("click", renderSalonPicker);

    var nameInput = document.getElementById("newSalonName");
    var slugInput = document.getElementById("newSalonSlug");
    var slugTouched = false;
    slugInput.addEventListener("input", function () { slugTouched = true; });
    nameInput.addEventListener("input", function () {
      if (slugTouched) return;
      slugInput.value = nameInput.value
        .toLowerCase()
        .normalize("NFD").replace(/[̀-ͯ]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    });

    document.getElementById("createSalonBtn").addEventListener("click", function () {
      var name = nameInput.value.trim();
      var slug = slugInput.value.trim();
      var errDiv = document.getElementById("createErr");
      errDiv.innerHTML = "";
      if (!name) { errDiv.innerHTML = errBox("Indica o nome do salão."); return; }
      if (!slug) { errDiv.innerHTML = errBox("Indica o link (slug) do salão."); return; }
      var btn = document.getElementById("createSalonBtn");
      btn.disabled = true; btn.textContent = "A criar…";
      sb.rpc("create_salon", { p_name: name, p_slug: slug }).then(function (r) {
        if (r.error) {
          btn.disabled = false; btn.textContent = "Criar salão";
          errDiv.innerHTML = (r.error.code === "23505")
            ? errBox("Já existe um salão com este link. Escolhe outro.")
            : errBox("Não foi possível criar o salão.");
          return;
        }
        var newId = r.data;
        sb.rpc("my_salons").then(function (r2) {
          mySalonsList = r2.data || [];
          var created = mySalonsList.find(function (s) { return s.salon_id === newId; });
          selectSalon(created || mySalonsList[mySalonsList.length - 1]);
        });
      });
    });
  }

  // ---------- Tabs shell ----------
  var TABS = [
    { id: "bookings", label: "Marcações" },
    { id: "services", label: "Serviços" },
    { id: "staff", label: "Profissionais" },
    { id: "salon", label: "Salão" },
    { id: "account", label: "Conta" }
  ];

  function renderTabsNav() {
    var nav = document.getElementById("tabsNav");
    nav.style.display = "flex";
    nav.innerHTML = TABS.map(function (t) {
      return '<button data-tab="' + t.id + '" class="' + (t.id === activeTab ? "active" : "") + '">' + t.label + "</button>";
    }).join("");
    nav.querySelectorAll("button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeTab = btn.getAttribute("data-tab");
        renderTabsNav();
        renderActiveTab();
      });
    });
  }

  function renderActiveTab() {
    if (activeTab === "bookings") return renderBookingsTab();
    if (activeTab === "services") return renderServicesTab();
    if (activeTab === "staff") return renderStaffTab();
    if (activeTab === "salon") return renderSalonTab();
    if (activeTab === "account") return renderAccountTab();
  }

  // ---------- Bookings tab ----------
  function renderBookingsTab() {
    document.getElementById("logoutBtn").style.display = "inline";
    renderApp('<section class="card"><div class="skel" style="width:40%"></div><div class="skel" style="width:80%"></div></section>');
    var today = new Date();
    var todayStr = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");

    sb.from("bookings")
      .select("id,client_name,client_phone,booking_date,start_time,end_time,notes,status,services(name),employees(name)")
      .eq("salon_id", currentSalon.salon_id)
      .eq("status", "confirmed")
      .gte("booking_date", todayStr)
      .order("booking_date")
      .order("start_time")
      .then(function (res) {
        if (res.error) { renderApp('<section class="card">' + errBox("Não foi possível carregar as marcações.") + "</section>"); return; }
        var rows = res.data || [];
        if (rows.length === 0) { renderApp('<section class="card"><h2>Marcações</h2><p class="empty">Sem marcações futuras.</p></section>'); return; }
        var groups = [];
        var lastDate = null;
        rows.forEach(function (r) {
          if (r.booking_date !== lastDate) { groups.push({ date: r.booking_date, items: [] }); lastDate = r.booking_date; }
          groups[groups.length - 1].items.push(r);
        });
        var html = groups.map(function (g) {
          var d = new Date(g.date + "T00:00:00");
          var label = fmtDatePt(g.date) + " · " + WEEKDAYS[d.getDay()];
          var items = g.items.map(function (b) {
            return (
              '<div class="booking" data-id="' + b.id + '">' +
                '<div class="time">' + b.start_time.slice(0, 5) + "</div>" +
                '<div class="info">' +
                  '<div class="name">' + escapeHtml(b.client_name) + " — " + escapeHtml((b.services && b.services.name) || "") + "</div>" +
                  '<div class="sub">' + escapeHtml((b.employees && b.employees.name) || "") + (b.notes ? " · " + escapeHtml(b.notes) : "") + "</div>" +
                "</div>" +
                '<div class="phone">' + escapeHtml(b.client_phone) + "</div>" +
                '<button class="small danger" data-id="' + b.id + '">cancelar</button>' +
              "</div>"
            );
          }).join("");
          return '<div class="day-group"><div class="day-label">' + label + "</div>" + items + "</div>";
        }).join("");
        renderApp('<section class="card"><h2>Marcações</h2>' + html + "</section>");
        document.querySelectorAll(".booking .small.danger").forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (!confirm("Cancelar esta marcação?")) return;
            btn.disabled = true; btn.textContent = "…";
            sb.from("bookings").update({ status: "cancelled" }).eq("id", btn.getAttribute("data-id")).then(function (r) {
              if (r.error) { alert("Não foi possível cancelar."); btn.disabled = false; btn.textContent = "cancelar"; return; }
              renderBookingsTab();
            });
          });
        });
      });
  }

  // ---------- Services tab ----------
  function renderServicesTab() {
    document.getElementById("logoutBtn").style.display = "inline";
    var rows = appData.services.slice().sort(function (a, b) { return a.sort_order - b.sort_order; });
    var itemsHtml = rows.map(function (s) {
      return (
        '<div class="item-row" data-id="' + s.id + '">' +
          '<input type="text" class="grow f-name" value="' + escapeHtml(s.name) + '" placeholder="Nome do serviço">' +
          '<input type="number" class="f-dur" min="5" step="5" value="' + s.duration_minutes + '" title="minutos">' +
          '<input type="number" class="f-price" min="0" step="0.5" value="' + (s.price == null ? "" : s.price) + '" title="preço €">' +
          '<label class="chk"><input type="checkbox" class="f-active" ' + (s.active ? "checked" : "") + '> ativo</label>' +
          '<button class="small save-svc">guardar</button>' +
          '<button class="small danger del-svc">eliminar</button>' +
        "</div>"
      );
    }).join("");
    renderApp(
      '<section class="card"><h2>Serviços</h2><div id="svcErr"></div>' +
        (rows.length ? itemsHtml : '<p class="empty">Ainda não há serviços.</p>') +
        '<div class="add-box">' +
          '<h3>Adicionar serviço</h3>' +
          '<div class="item-row" style="border-top:none;padding-top:0">' +
            '<input type="text" class="grow" id="newSvcName" placeholder="Nome do serviço">' +
            '<input type="number" id="newSvcDur" min="5" step="5" value="30" title="minutos">' +
            '<input type="number" id="newSvcPrice" min="0" step="0.5" placeholder="€" title="preço €">' +
            '<button class="small" id="addSvcBtn">adicionar</button>' +
          "</div>" +
        "</div>" +
      "</section>"
    );
    var errDiv = document.getElementById("svcErr");

    document.querySelectorAll(".item-row .save-svc").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var row = btn.closest(".item-row");
        var id = row.getAttribute("data-id");
        var patch = {
          name: row.querySelector(".f-name").value.trim(),
          duration_minutes: parseInt(row.querySelector(".f-dur").value, 10) || 30,
          price: row.querySelector(".f-price").value === "" ? null : parseFloat(row.querySelector(".f-price").value),
          active: row.querySelector(".f-active").checked
        };
        if (!patch.name) { errDiv.innerHTML = errBox("O nome não pode ficar vazio."); return; }
        errDiv.innerHTML = "";
        btn.disabled = true; btn.textContent = "…";
        sb.from("services").update(patch).eq("id", id).then(function (r) {
          btn.disabled = false; btn.textContent = "guardar";
          if (r.error) { errDiv.innerHTML = errBox("Não foi possível guardar."); return; }
          reloadDataAndRender();
        });
      });
    });
    document.querySelectorAll(".item-row .del-svc").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var row = btn.closest(".item-row");
        var id = row.getAttribute("data-id");
        if (!confirm("Eliminar este serviço?")) return;
        btn.disabled = true; btn.textContent = "…";
        sb.from("services").delete().eq("id", id).then(function (r) {
          if (r.error) {
            btn.disabled = false; btn.textContent = "eliminar";
            errDiv.innerHTML = isFkError(r.error)
              ? errBox("Este serviço já tem marcações associadas — não pode ser eliminado. Desativa-o em vez disso.")
              : errBox("Não foi possível eliminar.");
            return;
          }
          reloadDataAndRender();
        });
      });
    });
    document.getElementById("addSvcBtn").addEventListener("click", function () {
      var name = document.getElementById("newSvcName").value.trim();
      var dur = parseInt(document.getElementById("newSvcDur").value, 10) || 30;
      var priceRaw = document.getElementById("newSvcPrice").value;
      var price = priceRaw === "" ? null : parseFloat(priceRaw);
      if (!name) { errDiv.innerHTML = errBox("Indica o nome do serviço."); return; }
      errDiv.innerHTML = "";
      var maxSort = appData.services.reduce(function (m, s) { return Math.max(m, s.sort_order || 0); }, 0);
      var btn = document.getElementById("addSvcBtn");
      btn.disabled = true;
      sb.from("services").insert({ salon_id: currentSalon.salon_id, name: name, duration_minutes: dur, price: price, active: true, sort_order: maxSort + 1 }).then(function (r) {
        btn.disabled = false;
        if (r.error) { errDiv.innerHTML = errBox("Não foi possível adicionar."); return; }
        reloadDataAndRender();
      });
    });
  }

  // ---------- Staff tab ----------
  function renderStaffTab() {
    document.getElementById("logoutBtn").style.display = "inline";
    var itemsHtml = appData.employees.map(function (e) {
      var eligibleSvcIds = appData.empServices.filter(function (es) { return es.employee_id === e.id; }).map(function (es) { return es.service_id; });
      var svcChecks = appData.services.map(function (s) {
        return '<label><input type="checkbox" class="svc-chk" value="' + s.id + '" ' + (eligibleSvcIds.indexOf(s.id) !== -1 ? "checked" : "") + '>' + escapeHtml(s.name) + "</label>";
      }).join("");
      var hoursRows = [0, 1, 2, 3, 4, 5, 6].map(function (wd) {
        var h = appData.empHours.find(function (x) { return x.employee_id === e.id && x.weekday === wd; });
        var closed = !h || h.is_closed;
        var start = (h && h.start_time) ? h.start_time.slice(0, 5) : "09:00";
        var end = (h && h.end_time) ? h.end_time.slice(0, 5) : "19:00";
        return (
          '<div class="hrow" data-wd="' + wd + '">' +
            '<span class="wd">' + WEEKDAYS_SHORT[wd] + "</span>" +
            '<label class="chk"><input type="checkbox" class="h-closed" ' + (closed ? "checked" : "") + '> fechado</label>' +
            '<input type="time" class="h-start" value="' + start + '" ' + (closed ? "disabled" : "") + '>' +
            '<span>–</span>' +
            '<input type="time" class="h-end" value="' + end + '" ' + (closed ? "disabled" : "") + '>' +
          "</div>"
        );
      }).join("");
      return (
        '<div class="item-row" data-id="' + e.id + '" style="flex-direction:column;align-items:stretch">' +
          '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
            '<input type="color" class="f-color" value="' + (e.color || "#7c5cff") + '">' +
            '<input type="text" class="grow f-name" value="' + escapeHtml(e.name) + '" placeholder="Nome">' +
            '<label class="chk"><input type="checkbox" class="f-active" ' + (e.active ? "checked" : "") + '> ativo</label>' +
            '<button class="small save-emp">guardar</button>' +
            '<button class="small danger del-emp">eliminar</button>' +
          "</div>" +
          '<details class="emp-detail"><summary>serviços e horário</summary><div class="inner">' +
            '<div class="svc-chk-list">' + (svcChecks || '<span class="muted-note">Sem serviços criados ainda.</span>') + "</div>" +
            '<div class="hours-grid">' + hoursRows + "</div>" +
            '<button class="small save-sched">guardar serviços e horário</button>' +
          "</div></details>" +
        "</div>"
      );
    }).join("");

    renderApp(
      '<section class="card"><h2>Profissionais</h2><div id="staffErr"></div>' +
        (appData.employees.length ? itemsHtml : '<p class="empty">Ainda não há profissionais.</p>') +
        '<div class="add-box">' +
          '<h3>Adicionar profissional</h3>' +
          '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
            '<input type="color" id="newEmpColor" value="#7c5cff">' +
            '<input type="text" class="grow" id="newEmpName" placeholder="Nome">' +
            '<button class="small" id="addEmpBtn">adicionar</button>' +
          "</div>" +
        "</div>" +
      "</section>"
    );
    var errDiv = document.getElementById("staffErr");

    document.querySelectorAll(".hrow .h-closed").forEach(function (chk) {
      chk.addEventListener("change", function () {
        var row = chk.closest(".hrow");
        row.querySelector(".h-start").disabled = chk.checked;
        row.querySelector(".h-end").disabled = chk.checked;
      });
    });

    document.querySelectorAll(".save-emp").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var row = btn.closest(".item-row");
        var id = row.getAttribute("data-id");
        var patch = {
          name: row.querySelector(".f-name").value.trim(),
          color: row.querySelector(".f-color").value,
          active: row.querySelector(".f-active").checked
        };
        if (!patch.name) { errDiv.innerHTML = errBox("O nome não pode ficar vazio."); return; }
        errDiv.innerHTML = "";
        btn.disabled = true; btn.textContent = "…";
        sb.from("employees").update(patch).eq("id", id).then(function (r) {
          btn.disabled = false; btn.textContent = "guardar";
          if (r.error) { errDiv.innerHTML = errBox("Não foi possível guardar."); return; }
          reloadDataAndRender();
        });
      });
    });

    document.querySelectorAll(".del-emp").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var row = btn.closest(".item-row");
        var id = row.getAttribute("data-id");
        if (!confirm("Eliminar este profissional?")) return;
        btn.disabled = true; btn.textContent = "…";
        sb.from("employees").delete().eq("id", id).then(function (r) {
          if (r.error) {
            btn.disabled = false; btn.textContent = "eliminar";
            errDiv.innerHTML = isFkError(r.error)
              ? errBox("Este profissional já tem marcações associadas — não pode ser eliminado. Desativa-o em vez disso.")
              : errBox("Não foi possível eliminar.");
            return;
          }
          reloadDataAndRender();
        });
      });
    });

    document.querySelectorAll(".save-sched").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var row = btn.closest(".item-row");
        var id = row.getAttribute("data-id");
        var svcIds = Array.prototype.slice.call(row.querySelectorAll(".svc-chk:checked")).map(function (c) { return c.value; });
        var hourRows = Array.prototype.slice.call(row.querySelectorAll(".hrow")).map(function (hr) {
          var wd = parseInt(hr.getAttribute("data-wd"), 10);
          var closed = hr.querySelector(".h-closed").checked;
          return {
            employee_id: id,
            weekday: wd,
            is_closed: closed,
            start_time: closed ? null : hr.querySelector(".h-start").value + ":00",
            end_time: closed ? null : hr.querySelector(".h-end").value + ":00"
          };
        });
        errDiv.innerHTML = "";
        btn.disabled = true; btn.textContent = "…";
        sb.from("employee_services").delete().eq("employee_id", id).then(function () {
          var inserts = svcIds.length ? sb.from("employee_services").insert(svcIds.map(function (sid) { return { employee_id: id, service_id: sid }; })) : Promise.resolve({ error: null });
          return inserts;
        }).then(function (r1) {
          if (r1.error) throw r1.error;
          return sb.from("employee_hours").upsert(hourRows);
        }).then(function (r2) {
          btn.disabled = false; btn.textContent = "guardar serviços e horário";
          if (r2.error) throw r2.error;
          reloadDataAndRender();
        }).catch(function () {
          btn.disabled = false; btn.textContent = "guardar serviços e horário";
          errDiv.innerHTML = errBox("Não foi possível guardar. Tenta novamente.");
        });
      });
    });

    document.getElementById("addEmpBtn").addEventListener("click", function () {
      var name = document.getElementById("newEmpName").value.trim();
      var color = document.getElementById("newEmpColor").value;
      if (!name) { errDiv.innerHTML = errBox("Indica o nome."); return; }
      errDiv.innerHTML = "";
      var btn = document.getElementById("addEmpBtn");
      btn.disabled = true;
      sb.from("employees").insert({ salon_id: currentSalon.salon_id, name: name, color: color, active: true }).select().then(function (r) {
        if (r.error) { btn.disabled = false; errDiv.innerHTML = errBox("Não foi possível adicionar."); return; }
        var newId = r.data[0].id;
        var defaultHours = [0, 1, 2, 3, 4, 5, 6].map(function (wd) {
          return { employee_id: newId, weekday: wd, is_closed: wd === 0, start_time: wd === 0 ? null : "09:00:00", end_time: wd === 0 ? null : "19:00:00" };
        });
        sb.from("employee_hours").insert(defaultHours).then(function () {
          btn.disabled = false;
          reloadDataAndRender();
        });
      });
    });
  }

  // ---------- Salon tab ----------
  function renderSalonTab() {
    document.getElementById("logoutBtn").style.display = "inline";
    var s = appData.salon || {};
    var bookingUrl = window.location.href.replace(/admin\.html.*$/, "reservar.html") + "?salao=" + encodeURIComponent(s.slug || "");
    var icsUrl = SUPABASE_URL + "/functions/v1/calendar-feed?salon=" + encodeURIComponent(s.id || "") + "&token=" + encodeURIComponent(s.ics_token || "");
    renderApp(
      '<section class="card"><h2>Dados do salão</h2><div id="salonErr"></div><div id="salonOk"></div>' +
        '<label class="field"><span>Nome</span><input type="text" id="sName" value="' + escapeHtml(s.name || "") + '"></label>' +
        '<label class="field"><span>Telefone</span><input type="text" id="sPhone" value="' + escapeHtml(s.phone || "") + '"></label>' +
        '<label class="field"><span>Morada</span><input type="text" id="sAddress" value="' + escapeHtml(s.address || "") + '"></label>' +
        '<label class="field"><span>Intervalo entre horários disponíveis (min)</span><input type="number" id="sSlot" min="5" step="5" value="' + (s.slot_interval_minutes || 15) + '"></label>' +
        '<label class="field"><span>Quantos dias à frente aceitar marcações</span><input type="number" id="sWindow" min="1" step="1" value="' + (s.booking_window_days || 30) + '"></label>' +
        '<button class="primary" id="saveSalonBtn">Guardar</button>' +
      "</section>" +
      '<section class="card"><h2>Link de marcações</h2>' +
        '<p class="muted-note">Partilha este link com os teus clientes para marcarem online.</p>' +
        '<div class="item-row" style="border-top:none;padding-top:0">' +
          '<input type="text" class="grow" id="bookingUrlField" value="' + escapeHtml(bookingUrl) + '" readonly>' +
          '<button class="small" id="copyBookingUrl">copiar</button>' +
        "</div>" +
      "</section>" +
      '<section class="card"><h2>Calendário (feed .ics)</h2>' +
        '<p class="muted-note">Cola este link no Google Calendar, Apple Calendar ou Outlook como "subscrever calendário por URL" para veres as marcações a aparecer automaticamente (atualiza aproximadamente de hora a hora).</p>' +
        '<div class="item-row" style="border-top:none;padding-top:0">' +
          '<input type="text" class="grow" id="icsUrlField" value="' + escapeHtml(icsUrl) + '" readonly>' +
          '<button class="small" id="copyIcsUrl">copiar</button>' +
        "</div>" +
      "</section>"
    );
    document.getElementById("copyBookingUrl").addEventListener("click", function () { copyText(bookingUrl, this); });
    document.getElementById("copyIcsUrl").addEventListener("click", function () { copyText(icsUrl, this); });
    document.getElementById("saveSalonBtn").addEventListener("click", function () {
      var patch = {
        name: document.getElementById("sName").value.trim() || "Salão",
        phone: document.getElementById("sPhone").value.trim() || null,
        address: document.getElementById("sAddress").value.trim() || null,
        slot_interval_minutes: parseInt(document.getElementById("sSlot").value, 10) || 15,
        booking_window_days: parseInt(document.getElementById("sWindow").value, 10) || 30
      };
      var errDiv = document.getElementById("salonErr");
      var okDiv = document.getElementById("salonOk");
      errDiv.innerHTML = ""; okDiv.innerHTML = "";
      var btn = document.getElementById("saveSalonBtn");
      btn.disabled = true; btn.textContent = "A guardar…";
      sb.from("salons").update(patch).eq("id", currentSalon.salon_id).then(function (r) {
        btn.disabled = false; btn.textContent = "Guardar";
        if (r.error) { errDiv.innerHTML = errBox("Não foi possível guardar."); return; }
        currentSalon.name = patch.name;
        document.getElementById("titleEl").textContent = patch.name;
        okDiv.innerHTML = '<div class="ok-box">Guardado.</div>';
        reloadDataAndRender(true);
      });
    });
  }

  // ---------- Account tab ----------
  function renderAccountTab() {
    document.getElementById("logoutBtn").style.display = "inline";
    renderApp(
      '<section class="card"><h2>Conta</h2>' +
        '<div id="pwChangeErr"></div><div id="pwChangeOk"></div>' +
        '<label class="field"><span>Nova password</span><input type="password" id="newPw" autocomplete="new-password"></label>' +
        '<button class="primary" id="pwChangeBtn">Guardar nova password</button>' +
      "</section>"
    );
    document.getElementById("pwChangeBtn").addEventListener("click", function () {
      var pw = document.getElementById("newPw").value;
      var errDiv = document.getElementById("pwChangeErr");
      var okDiv = document.getElementById("pwChangeOk");
      errDiv.innerHTML = ""; okDiv.innerHTML = "";
      if (pw.length < 8) { errDiv.innerHTML = errBox("A password tem de ter pelo menos 8 caracteres."); return; }
      var btn = document.getElementById("pwChangeBtn");
      btn.disabled = true; btn.textContent = "A guardar…";
      sb.auth.updateUser({ password: pw }).then(function (res) {
        btn.disabled = false; btn.textContent = "Guardar nova password";
        if (res.error) { errDiv.innerHTML = errBox("Não foi possível mudar a password."); return; }
        document.getElementById("newPw").value = "";
        okDiv.innerHTML = '<div class="ok-box">Password alterada.</div>';
      });
    });
  }

  // ---------- Data loading ----------
  function reloadDataAndRender(skipRerenderSameTab) {
    var salonId = currentSalon.salon_id;
    Promise.all([
      sb.from("salons").select("*").eq("id", salonId).single(),
      sb.from("services").select("*").eq("salon_id", salonId),
      sb.from("employees").select("*").eq("salon_id", salonId)
    ]).then(function (results) {
      appData.salon = results[0].data;
      appData.services = results[1].data || [];
      appData.employees = results[2].data || [];
      var empIds = appData.employees.map(function (e) { return e.id; });

      if (empIds.length === 0) {
        appData.empServices = [];
        appData.empHours = [];
        if (!skipRerenderSameTab) renderActiveTab();
        return;
      }

      Promise.all([
        sb.from("employee_services").select("employee_id,service_id").in("employee_id", empIds),
        sb.from("employee_hours").select("employee_id,weekday,start_time,end_time,is_closed").in("employee_id", empIds)
      ]).then(function (results2) {
        appData.empServices = results2[0].data || [];
        appData.empHours = results2[1].data || [];
        if (!skipRerenderSameTab) renderActiveTab();
      });
    });
  }

  function checkAdminAndLoad() {
    sb.auth.getUser().then(function (res) {
      var user = res.data && res.data.user;
      if (!user) { renderLogin(); return; }
      sb.rpc("my_salons").then(function (r) {
        if (r.error) {
          document.getElementById("logoutBtn").style.display = "inline";
          document.getElementById("tabsNav").style.display = "none";
          renderApp('<section class="card">' + errBox("Não foi possível carregar os teus salões. Tenta novamente.") + "</section>");
          return;
        }
        mySalonsList = r.data || [];
        if (mySalonsList.length === 0) { renderCreateSalon(); return; }
        if (mySalonsList.length === 1) { selectSalon(mySalonsList[0]); return; }
        var lastId = null;
        try { lastId = localStorage.getItem("lastSalonId"); } catch (e) {}
        var match = lastId && mySalonsList.find(function (s) { return s.salon_id === lastId; });
        if (match) { selectSalon(match); return; }
        renderSalonPicker();
      });
    });
  }

  function boot() { checkAdminAndLoad(); }

  document.getElementById("logoutBtn").addEventListener("click", function () {
    currentSalon = null;
    mySalonsList = [];
    document.getElementById("switchSalonBtn").style.display = "none";
    sb.auth.signOut().then(function () { renderLogin(); });
  });
  document.getElementById("switchSalonBtn").addEventListener("click", function () {
    sb.rpc("my_salons").then(function (r) {
      mySalonsList = r.data || mySalonsList;
      renderSalonPicker();
    });
  });

  sb.auth.onAuthStateChange(function () { checkAdminAndLoad(); });
  boot();
})();
</script>
</body>
</html>
